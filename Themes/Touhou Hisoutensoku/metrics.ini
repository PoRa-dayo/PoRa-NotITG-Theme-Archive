[EditMenu]
// --------------------------------------------------------------------------------,
// {Editor Main Menu}								   |
// --------------------------------------------------------------------------------'
// The Screen itself is named ScreenEditMenu. It's where you pick the group, song, difficulty, etc. that you want to edit.
// Recommended to check other themes to find all the properties you can edit for the editor screens,
// since this one here is mostly just an ITG2 theme reskin, so there isn't a lot that's changed.

// Arrows are the left and right arrows that are basically the cursor of this screen. Their graphics are named EditMenu Left and EditMenu Right.
// Meter is the difficulty number that shows up at the Steps selection whenever the selected difficulty has an existing chart.
// SourceMeter is the difficulty number that shows up at the Fill Steps selection whenever the selected difficulty has an existing chart.
// You might also want to check out [EditDifficultyMeter].
// Also the SongTextBanners use the same settings as in [TextBanner] because fuck you.
// (In this theme SongTextBanner has different zoom because ScreenEditMenu underlay changed it)
Arrows1X=SCREEN_CENTER_X-140
Arrows2X=SCREEN_CENTER_X+260
ArrowsEnabledColor=1,1,1,1
ArrowsDisabledColor=1,1,1,0
SongBannerX=SCREEN_CENTER_X+170
