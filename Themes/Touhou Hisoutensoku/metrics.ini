// "firstchoicegoesdown" is a special OptionMenuFlag that applies various things to the current options screen, such as
// the first choice of each option being a triangle pointing down (some themes even design unique sprites for this),
// pressing Start on it will redirect the player to the next option below;
// the player must press Start to select the choice, after which the cursor will be redirected all the way back to the triangle.
// ExportOnChange does not do anything with "firstchoicegoesdown" enabled.

// Removing "firstchoicegoesdown" will make the options screen behave more like in the game Options, such as
// With SelectOne rows, the cursor is always positioned at the currently selected choice;
// and the player does not have to press Start to select the choice.
// With SelectMultiple rows, the cursor is always positioned at the last selected choice;
// and pressing Start does not redirect the cursor anywhere.
// If ExportOnChange is true, then the option row's SaveSelection will be triggered right when the player's cursor is positioned at the choice.
// If ExportOnChange is false, then the option row's SaveSelection will only be triggered when the player Exit to enter the NextScreen.

// This theme does not use "firstchoicegoesdown" at all.
