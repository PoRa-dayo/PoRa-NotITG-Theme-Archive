// This theme used PrismRhythm 19 as a base so some of its documentation is still here
// Parts of the documentation that aren't applicable to this theme are omitted

// .-------------------------------------------------------------------------------------------------------------,
// |                                                Main Metrics						 |
// `-------------------------------------------------------------------------------------------------------------'
//
// --------------------------------------------------------------------------------,
// Introduction									   |
// --------------------------------------------------------------------------------'
// It looks complicated, but it's actually rather easy to navigate the Metrics once you know how it's organized.
// Anything [between brackets] is the title of a category; those beginning with "Screen" tell the theme that the
// items in that category are parameters for use on that particular screen.
//
// Once you know the name of a category, it becomes easy to just hit Ctrl-F to search and navigate to it quickly.
// Lines that begin with two slashes are notes for Metrics tweakers to read.
//
// Oh btw, PoRa here, some general things you need to know about theming in NotITG.
// Holding F3 opens the Debug Menu. Look at key_e, that's the name of the current screen.
// Please go to NotITG game folder, Data/Stepmania.ini and make ShowLogOutput=1 if you haven't already. It will help a lot.
// In themes with Stitch.lua stuff implemented, you can use the in-game console. Ctrl+9 is the default keybind for it.
// Use SCREENMAN:GetTopScreen() in the console often, it will show you all the elements currently on-screen as well as their names
// on both the console and the log.
// In addition to editing said elements in the metrics, remember that you can also capture these elements using GetChild functions
// for your own custom usage in lua/xml files, or capture them from right here via those elements' Commands (assign self to a global variable).
// e.g. SCREENMAN:GetTopScreen():GetChild('PaneDisplayP1'):GetChild(''):GetChild('MachineHighScoreText'):GetText() in ScreenSelectMusic
// gives you P1's score as it shows in the PaneDisplayP1.
// NotITG documentation: https://craftedcart.gitlab.io/notitg_docs/

// Also grab OpenITG source code here: https://github.com/openitg/openitg
// Theme documentations including this one will reference it every once in a while, as if citing the bible.

[Global]
FallbackTheme=default

[Common]
// --------------------------------------------------------------------------------,
// {Common Elements}								   |
// --------------------------------------------------------------------------------'
// -------------------------------------------.
// Player Colors                              |
// -------------------------------------------'
ColorP1=@PlayerColor(PLAYER_1)
ColorP2=@PlayerColor(PLAYER_2)
// -------------------------------------------.
// First Screen                               |
// -------------------------------------------'
// First Screen is now InitializeScripts to initialize Stitch.lua.
// The FirstAttractScreen is now the visible screen that the player sees first when booting up the game,
// which is also what the GetStartScreen function uses.
FirstAttractScreen=ScreenInit
InitialScreen=InitializeScripts
