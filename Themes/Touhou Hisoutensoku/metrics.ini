// -------------------------------------------.
// Default Resolution                         |
// -------------------------------------------'
ScreenWidth=640
ScreenHeight=480
// -------------------------------------------.
// Overlay Screens                            |
// -------------------------------------------'
// Screens that are layered above everything else, even during modfiles.
// Added OverlayScreen which is the screen we will use for stuff like FailOverlay and the in-game console.
OverlayScreens=WideResOverlay,ScreenSystemLayer,ScreenSyncOverlay,ScreenDebugOverlay,OverlayScreen

