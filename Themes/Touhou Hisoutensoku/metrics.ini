[ScreenOptionsMaster]
// --------------------------------------------------------------------------------,
// {Modifier Lists} 								   |
// --------------------------------------------------------------------------------'
// These are the parameters used by the Mod Menu.  You can add or take out mods as you like:
// just make sure you re-number the list properly, and go back up to the top of the list you altered to
// tell it the new total number of options in its list, or it will crash when it tries to display it!
// You can also set new defaults for each mod list (using the list's respective Default parameter).
// If you add new speed mods, you'll also need to go into the Languages -> English file and add the new mod's
// name there, as well, or it will display a blank option on the list.
// The first item is the number of options in the list, the second is the default; after that is the list of options.
// If you want to change what order the lines are displayed in, check the other ScreenXOptions screens.
// Menu flags that affect the whole options page are also in the other ScreenXOptions screens.

// There's also stuff like "together", "SelectNone", etc. next to the total number of options.
// These are "option flags" which change the behavior of that option row.
// "Together" forces the cursor to move together for both players.
// "SelectNone" makes the option unselected by default, and otherwise acts like SelectOne,
// mainly used for the very first page in the game options.
// "SelectOne" means each player can only select ONE option on that option row, no more, no less.
// "SelectMultiple" means each player can select or deselect any options they wish on that row.
// -------------------------------------------.
// Main Settings		              |
// -------------------------------------------'
Arcade Options=1;together;SelectNone
Arcade OptionsDefault=
Arcade Options,1=screen,ScreenArcadeOptions;name,Arcade Options
Reset Menu=1,together;SelectNone
Reset MenuDefault=
Reset Menu,1=screen,ScreenResetOptions;name,Reset Menu
Graphic Options=1;together;SelectNone
Graphic OptionsDefault=
Graphic Options,1=screen,ScreenScreenSettings;name,Graphic Options
Advanced Graphic Options=1;together;SelectNone
Advanced Graphic OptionsDefault=
Advanced Graphic Options,1=screen,ScreenGraphicOptions;name,Advanced Graphic Options
// -------------------------------------------.
// Mod Lists			              |
// -------------------------------------------'
// ------------------.
// Perspectives      |
// ------------------'
