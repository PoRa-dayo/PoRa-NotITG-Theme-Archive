// -------------------------------------------.
// Groove Radar		                      |
// -------------------------------------------'
// each radar value ranges from 0 to 1

// (NoteDataUtil.cpp from line 652)
// STREAM
// notes = (# tap notes + # holds & rolls)
// notes_per_second = notes / song_length_seconds
// stream = notes_per_second / 7
// VOLTAGE
// AverageBPS = number_of_final_beat / song_length_seconds
// density = run through each beat window and found the maximum density of notes in a beat window
// voltage = AverageBPS * density / 10 
// AIR
// air = # jumps / song_length_seconds
// FREEZE
// freeze = # holds & rolls / song_length_seconds
// CHAOS
// notes_chaos = # notes that aren't 4ths and 8ths
// chaos = notes_chaos / song_length_seconds * 0.5

// Obviously, we don't use this, so we hide it.
