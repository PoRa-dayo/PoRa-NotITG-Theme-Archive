// How each entry in the CourseContents is displayed. The song title (TextBanner) in each entry can be modified via [CourseTextBanner]

// There is a Bar you can enable by having a CourseEntryDisplay Bar.png in your Graphics folder, which is a graphic that's placed behind each entry.
// The entries are also automatically spaced out in accordance to the bar's height (!!!)
// The bar also scrolls along with the entries, and the bar's width is also used as the width of the scroller mask (!!!)
// The bar in this theme is visible.

// SeparateCourseMeters when turned off will display meters (difficulties) for only P1,
// and thus the difficulties and foots will be controlled via FootX, FootY, DifficultyX, and DifficultyY instead (why does this exist???)

