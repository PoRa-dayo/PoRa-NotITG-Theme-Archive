// --------------------------------------------------------------------------------,
// {Screen Branch}								   |
// --------------------------------------------------------------------------------'
// Screen Branches are powerful! These are screens that, when opened, will redirect you to other screens based on whether its condition is met.
// Conditions are checked from smaller numbers to bigger numbers, so first it'll check Condition1, if fail, check Condition2, and so on.
// As an example, here, if the mode is Marathon (Course), FailImmediate is activated before going to ScreenStage.
// If all of the above conditions don't satisfy, it'll just go to ScreenStage.

// Screen Branches are usually used in other themes to allow loads of in-theme player customizations.
// The ITG themes including this one doesn't make full use of this, and I honestly don't recommend you to use Branches in metrics.ini either.
// You can do it like Mad Matt's themes (e.g. Simply Love) - have an entire Branches.lua folder in Scripts that contains functions
// related to branching screens, and make the PrevScreens and NextScreens in metrics.ini use it.
# This comes after options screens.  Set up modes, if any, and go to the stage screen.
# This must be done in this order; if you load a ScreenBranch from ScreenStage, the
# "minimum load delay" behavior won't work.
[ScreenBranchStage]
Fallback=Screen
Class=ScreenBranch
Fallback=ScreenBranch
Choices=1,2,3,4,5,6,7
# If either player selected easy steps, then first stage is FailOff, others
# are FailEndOfSong.
# If neither player selected easy steps, then first stage is FailEndOfSong,
# others are FailImmediate.
Condition1=GAMESTATE:IsCourseMode()
Condition2=true
NextScreen1=mod,FailImmediate;screen,ScreenStage
NextScreen2=screen,ScreenStage

[ScreenStage]
// --------------------------------------------------------------------------------,
// {Transition Screen}								   |
// --------------------------------------------------------------------------------'
// The screen right before you actually play a song that tells you the name of the song
// on top of a random background (and also the Event Mode text or the Stage text).
// Most of this is set in BGAnimations -> ScreenStage files
// so there isn't much of anything in *here* at all.
// -------------------------------------------.
// Main Settings			      |
// -------------------------------------------'
NextScreen=@GetGameplayScreen()
PrevScreen=@SongSelectionScreen()
MinimumDelay=0
ShowBanner=0
AllowBack=0

[ScreenGameplay]
// --------------------------------------------------------------------------------,
// {Gameplay Screen}								   |
// --------------------------------------------------------------------------------'
// You should be familiar with this.  Arrows go up the screen, people hit them.  That screen.
// -------------------------------------------.
// Main Settings			      |
// -------------------------------------------'
NextScreen=@GetGameplayNextScreen()
PrevScreen=@SongSelectionScreen()
SongSelectScreen=@SongSelectionScreen()
// FailAfter30Misses interrupts certain special modfiles. Make sure to disable it.
FailAfter30Misses=0
// When set like this, giving up in Course Mode means giving up the whole course.
// If it's false in Course Mode, giving up means skipping to the next song.
GivingUpGoesToNextScreen=GAMESTATE:IsCourseMode()
