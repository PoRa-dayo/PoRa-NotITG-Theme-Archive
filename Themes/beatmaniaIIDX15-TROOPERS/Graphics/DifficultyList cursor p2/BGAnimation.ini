[BGAnimation]

[Layer1]
File=decide.png
Command=rotationz,90;addx,-1;addy,6
Condition=GAMESTATE:IsHumanPlayer(1) and not GAMESTATE:IsHumanPlayer(0)

[Layer2]
File=P2.png
Command=rotationz,90;addx,-1;addy,6
Condition=GAMESTATE:IsHumanPlayer(0) and GAMESTATE:IsHumanPlayer(1)

[Layer3]
File=Rave.png
Command=rotationz,90;addx,-1;addy,6
Condition=GAMESTATE:IsHumanPlayer(0) and GAMESTATE:IsHumanPlayer(1) and PlayModeName() == "Rave"