[BGAnimation]

//////Difficulty/////
[Layer1]
File=beginner.png
Condition=GetEasiestNotesDifficulty() == 0
Command=x,SCREEN_CENTER_X;y,SCREEN_CENTER_Y;blend,add;addx,-10;diffusealpha,0;sleep,.4;linear,.2;addx,10;diffusealpha,1;sleep,1.8;linear,.4;zoom,.8

