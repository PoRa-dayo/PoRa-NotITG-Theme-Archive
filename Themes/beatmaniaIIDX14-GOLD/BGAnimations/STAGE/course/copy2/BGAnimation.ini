[Layer1]
File=../single.png
Command=blend,add;diffusealpha,0;sleep,2.4;diffusealpha,.6;linear,.4;zoom,1.8
Condition=CurStyleName()=="single" and GAMESTATE:IsHumanPlayer(0) and not GAMESTATE:IsHumanPlayer(1) or CurStyleName()=="single" and GAMESTATE:IsHumanPlayer(1) and not GAMESTATE:IsHumanPlayer(0) or CurStyleName()=="solo" and GAMESTATE:IsHumanPlayer(0) and not GAMESTATE:IsHumanPlayer(1) or CurStyleName()=="solo" and GAMESTATE:IsHumanPlayer(1) and not GAMESTATE:IsHumanPlayer(0)

[Layer2]
File=../2P.png
Command=blend,add;diffusealpha,0;sleep,2.4;diffusealpha,.6;linear,.4;zoom,1.8
Condition=GAMESTATE:IsHumanPlayer(0) and GAMESTATE:IsHumanPlayer(1)

[Layer3]
File=../double.png
Command=blend,add;diffusealpha,0;sleep,2.4;diffusealpha,.6;linear,.4;zoom,1.8
Condition=CurStyleName()=="double"