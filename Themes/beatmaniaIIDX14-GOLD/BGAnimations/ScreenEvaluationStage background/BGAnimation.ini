[BGAnimation]

[Layer1]
Import=FAILED
Condition=GetBestGrade() >= Grade("D")

[Layer2]
Import=CLEAR
Condition=GetBestGrade() < Grade("D")

[Layer3]
Import=A

[Layer4]
Import=AA

[Layer5]
Import=AAA

[Layer6]
Import=EXTRA

[Layer8]
Import=result_header

[Layer9]
Import=clearframe
Condition=GetBestGrade() < Grade("D")

[Layer10]
Import=failedframe
Condition=GetBestGrade() >= Grade("D")

[Layer11]
