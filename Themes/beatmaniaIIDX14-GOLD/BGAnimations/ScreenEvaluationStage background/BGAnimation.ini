Command=x,SCREEN_CENTER_X;y,SCREEN_CENTER_Y;blend,add;zoomx,20;zoomy,0;linear,.1;zoomy,3;linear,.1;zoom,4;linear,.2;zoom,4.2;diffusealpha,0
