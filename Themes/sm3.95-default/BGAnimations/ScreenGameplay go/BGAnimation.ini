[BGAnimation]
LengthSeconds=1.5

# This implements FocusingSprite.  Three copies of the sprite; one stays
# put, one moves in and out from the top-left and one moves in and out
# from the bottom-right; each fades from 0 alpha to .5 alpha and back.

[Layer1]
File=go.png
Type=0		// 0=sprite, 1=stretch, 2=particles, 3=tiles
Command=x,SCREEN_CENTER_X;y,SCREEN_CENTER_Y;diffusealpha,0;linear,0.5;diffusealpha,.5;sleep,0.5;linear,0.5;diffusealpha,0

[Layer2]
File=go.png
Type=0		// 0=sprite, 1=stretch, 2=particles, 3=tiles
Command=x,SCREEN_CENTER_X-100;y,SCREEN_CENTER_Y-100;diffusealpha,0;linear,0.5;diffusealpha,.5;x,SCREEN_CENTER_X;y,SCREEN_CENTER_Y;sleep,0.5;linear,0.5;diffusealpha,0;x,SCREEN_CENTER_X-100;y,SCREEN_CENTER_Y-100

[Layer3]
File=go.png
Type=0		// 0=sprite, 1=stretch, 2=particles, 3=tiles
Command=x,SCREEN_CENTER_X+100;y,SCREEN_CENTER_Y+100;diffusealpha,0;linear,0.5;diffusealpha,.5;x,SCREEN_CENTER_X;y,SCREEN_CENTER_Y;sleep,0.5;linear,0.5;diffusealpha,0;x,SCREEN_CENTER_X+100;y,SCREEN_CENTER_Y+100

