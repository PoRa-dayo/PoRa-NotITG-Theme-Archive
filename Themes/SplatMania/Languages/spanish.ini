[OptionExplanations]
GraphicQuality=Cambia la calidad de los graficos. Teniendo un valor mas bajo puede causar un juego borroso, pero puede incrementar el rendimiento.
Windowed=Elige si quieres correr SplatMania en pantalla completa, o en una ventana en tu escritorio.
SongsPerPlay=El número de canciones que un jugador puede jugar en los modos Normal y Batalla.
EventMode=Cuando está Encendido, "Juego Libre" también es encendido, el juego dura para siempre, y el modo ejercicio se vuelve disponible.
LifeDifficulty=Aumentando este valor causará que la vida del jugador se acabe más rapido y se recarge más lento.
DefaultFailTypeNoOff=IMMEDIATE hace que termine el juego cuando los jugadores no tengan vida. ::END OF SONG hace que termine el juego cuando al terminar la canción, los jugadores no tengan vida.
Noteskin=Choose a different appearance for the arrows.
Judgment Font=Pick your judgment font.
Hold Judgment=Pick your hold judgment font.
Rate=Play the music at a faster or slower rate.
Coin System=Disable the coin system if it causes the game to lag and/or crash too often. When disabled, your coin progress won't be affected, but you also won't earn any more coins.
Countdown=Enable or disable the countdown that shows up near the end of the song.

