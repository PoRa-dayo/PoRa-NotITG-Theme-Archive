# Game Mode Choices
[SelectGameMode]
DanceHeader=¡Juega el modo regular solo, o con un amigo!
DanceDescription=El tipico modo que conocen. Ya sabes como funciona: ¡Dale a las notas para tener la mejor puntuación!::::Toda la selección de opciones está disponible en este modo.

BattleHeader=¡Enfrentate contra un amigo o enemigo, o la computadora!
BattleDescription=¡Preparate, para una verdadera batalla! Este modo combina varias cosas que has aprendido en el modo Regular, y los pone en un caos.::::Los modificadores son usados en este modo, ¡así que presta atención a las notas para que no pierdas!::::La selección de opciones en este modo es limitada, para prevenir modificadores invalidos.

MarathonHeader=Splat your way through multiple songs in one go!
MarathonDescription=This mode will have you play through a set of songs non-stop! Can you survive until the end?::::Los modificadores son usados en este modo, ¡así que presta atención a las notas para que no pierdas!::::La selección de opciones en este modo es limitada, para prevenir modificadores invalidos.