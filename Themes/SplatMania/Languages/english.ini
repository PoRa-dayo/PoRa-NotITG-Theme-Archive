# Game Mode Choices
[SelectGameMode]
DanceHeader=Play your regular style alone, or with your buddy!
DanceDescription=The regular mode that you all know. You know the drill: Hit the arrows to try to get the highest score!::::The whole suite of options is available to you in this mode.

BattleHeader=Battle against a friend or foe, or the computer itself!
BattleDescription=Prepare youself, for a real battle! This mode combines several things that you've learned in Dance Mode, and puts them into a mess.::::Modifiers are used in this mode, so pay close attention to the notes so you don't fail!::::The suite of options is limited in this mode, to prevent invalid mods.

MarathonHeader=Splat your way through multiple songs in one go!
MarathonDescription=This mode will have you play through a set of songs non-stop! Can you survive until the end?::::Modifiers are used in this mode, so pay close attention to the notes so you don't fail!::::The suite of options is limited in this mode, to prevent invalid mods.