line 0=辱准院盛席筋延儀氏敬批恥党株歴歯拉協妥愉沖悩亭房浸頂恩舵狡猾
line 1=妹這阻昨春衆拝堪忍屁雫横弔朱巧悶翌慎社甚胆坊客沙汰幕柄懇腑就
line 2=掲罰盟益欺懐璧慮講寝雰華曽樵科姦猟曜浜勃航狐謎卵校寡析盲峙嫉
line 3=妬侍脱依企託墜憂諾還掃籍臣迫捉糾貧慣景査控併麻酔鯨村往侮偽徒
line 4=脅茶痕斐凄摂課綻昼贈勘縦柳猊迅滴拷傘改脆弁審俗蔑采叱悼莫煉遮
line 5=浴歪甦劫惰寞冠濯河咆哮智此呵妻釈踪辞冤朗誌典孔嬢列些維杯粋摘
line 6=締閣掛紺舎衰墳扉肢陛喪絆伐拘咤百挨拶奸弄拭措婦池著触偶堂掻刺
line 7=暫郊旨肖胎慄献郵京佐抽戴紙禍垂軌溝崎匡某絵盆渾裏迎読並乳価斉
line 8=郭寺穀倉滝峠疑鶏碑潰祷鼠瞳菊螺鈿詩拳波斬勧蔦塑稲縫捻嚇晄桜猪
line 9=鼻臭菌囁瀕躱咏獲徐陰詠群暖硬貨棍伸透噂儲獅飢副蜃楼壱弐砲鉾蟹
line 10=秤蠍羯瓶坂斡旋歳隻邦掘遭遇霧悦酬絨毯橋癒髭矛絹鉢靴焉弦穂尖吟
line 11=轄鴎漁館礁壌穫夏逸舶畏匠窓艇泊棺篭哨麦募渓云農拐呻姫恒据孵唾
