line 0=節脂泌徹船箱達管鍵貝含堆粒鉱符沢岳針塗承夜狭密徴灯警銅施創枯
line 1=幹渡崩隙感漂鎚勇訴哀若賊老慕蛇背握踵蜜剥底軟盤茎絡樽貴飲資二
line 2=始続画個庫設更残店欲買押姉嬉紹派遣要竹証廃役割鋼蓮崇爆腰膚職
line 3=履燃静治様禁隣規融語停量腕急魅殊侵砕電覚表事総購新記検索訓思
line 4=連情拡縮括板妨越及傾誉愚許訳俺災討卑劣郎似私恨君貫臆逝故郷刹
line 5=那溺償供慢救僅怯誇勝談笑悟届裁貨鎖汝返蘇悠報豊嘆洗虔捕醜願緩
line 6=胞鐘淵誘漆幾瞳車如厳営継栄巡紛婚姻奨励煽宣庇損拒否渋陣枢卿虐
line 7=旗拗第額区寂週惨劇促領粛撤問題策謀賞懸輩惑讐論挟棟略梁墟繰焦
line 8=掌頼綱求駐留被嫁Ⅵ稼請伺憤懣逆離想皆測業狙走過夫頃驚愕才娘疲
line 9=渇端為富裕縛殴咬援鈍芝叔荷玄添腐奈奮抜遅繁博覆提箇販委秒嫌閥
line 10=宗暴穏均把途基育汎忠糧秀膠任識学逐距僧侶衝凌胴粘挙述視諸疎答
line 11=顔参飽露孤袂隷弟困挫折勉疑緒泣尽悔征誕注肝棄遠挑則例淡費便煩
line 12=馴頻習践借虎僕親歓傭謝暑納皇帝諜罪卒赦詮是致罠携監怠駄蓄釣祖
line 13=縁雇褒牢喜抑翁傍賭誠牧聡衛隊仰躍督赴彩細到辛呂揆幸埒朽預研究
line 14=興虜款冒涜脳誤克憶隅働渉豚屈叩叶吃観給偵察奉政暮襲労休案享貪
line 15=怨詫畜酷毎賠筈幽愁塩試図婆庁麗垢績母涯祥浪省推網斥捜敢卓怪齢

