[OptionExplanations]

// 追加分

Judge=判定表示を変更するオプションです.  PROTIMINGでは判定が100段階で表示されます。
SubEffect=
DangerEffect=相当の事が無い限り選ばない事をお勧めします。

AllowExtraStage=オンにすると特定の条件を満たしていればエキストラステージに突入する事ができます。
Announcer=インストールされているアナウンサーデータを表示します。詳しいことについてはREADMEをご覧下さい。
AnnouncerTitle=Announcer
AttractSoundFrequency=Set to ALWAYS to play sound every during the attract screens.   Set to N TIMES to play sounds every N attract sequences.  
AutogenGroupCourses=AutoGen機能より一部鬼コース・連コースを自動作成します.  
AutogenSteps=選択したモード用の譜面が無い場合他のモード用の譜面を元に譜面を自動生成します.
AutoMapOnJoyChange=オンにしておくと専用コントローラー等を使用する際に自動で再アサインしてくれます.  通常はオンにしておくといいでしょう/  
AutoPlay=コンピューターによる自動演奏を行います.  ただし、この機能をオンにするとスコアが保存されませんし、エキストラステージへ進む事もできません.  
BackDelayed=HOLDに設定した場合Backボタンは0.5秒以上押し続けないと反応しなくなります.　 特に専用コントローラーを使用する場合、誤ってBackボタンを押してしまう事態を防げるでしょう.
BackgroundMode=ゲームプレイ時に表示される背景の設定をします.  OFFは曲で使用されているバックグラウンドのみ、&oq;Animations&cq; はBGAnimationsフォルダに入ってるアニメーションをランダムで表示、&oq;Visualizations&cq; はVisualizationフォルダに入っているムービーをランダムでオーバーレイ表示、&oq;Random Movies&cq;はRandomMoviesフォルダに入っている動画をランダムで表示します.  ただし、ムービーが定義されている曲データはこれらの設定が一切無効になります.  
BeginnerHelper=習譜面を選んだ時のみバックグラウンドダンサーを表示します.  
Brightness=背景の明るさを設定します.  数値が低いほど矢印が見やすくなります.  
Caution=スタート後の警告画面を表示します.  
CoinMode=HOMEを選択するとタイトル画面にメニューが出てきます.  PAYはメニューが出てこない上、コイン(ボタン)を入れないとゲームがプレイできません.  FREEだとコイン(ボタン)無しでもスタートボタンを押すことによりプレイできますが、メニューは表示されません.  PAY、FREEでもScrollLockを押す事によってオプション設定画面に入ることができます.
CoinModeNoHome=PAYはスタート時にコインを入れないとプレイできません.  FREEはコインを入れなくてもスタートボタンを押すことによりプレイできます.  PAY、FREEは両方メニューが表示されず、HOMEのみメニューが表示されます.  
CoinsPerCredit=クレジット数を設定します.  コイン数が設定された数値を超えてないとゲームをプレイすることができません.  
CourseSort=コースプレイ(連・鬼)でのソート設定を変更します.  
DancingCharacters=このモードをオフにしているとバックグラウンドにダンサーが表示されません.    オンにするとstepmaniaに入ってるダンサーデータが表示されます.  
Danger=この設定をオンにするとゲージが残り少ない時に警告がバックグラウンドに表示されます.
DefaultFailType=ゲームオーバー時の設定を変更します.  ARCADEだとライフバーが0になった時点で曲が終了しゲームオーバーとなり、END OF SONGは途中ライフバーが無くなってもゲームオーバーにはなりません.  OFFはライフバー関係無く次のステージへ進むことができます.  
DefaultNoteSkin=デフォルトのノートスキン(矢印)を選択します.  詳しいことについてはreadmeをご覧下さい.  
DisplayColor=画面の色を変更できます.  ただし、ウィンドウモードでは適用されません.  
DisplayMode=ステップマニアの起動状態を選択します.  フルスクリーンだと全画面表示、ウィンドウだとデスクトップ上に表示します.  
DisplayResolution=画面の解像度を選択できます.  高ければ高いほど鮮明になる分、処理が重くなります.  
Premium=coinモードをPAYの時のみ有効.  １クレジットでダブルができるかどうか.  
EasterEggs=イースターエッグ(隠し演出)を有効にします.  (foonmixではイースターエッグ演出を外してあるのでオンにしても動作しません)
FastLoad=この項目をオンにすると曲データが更新されても変更しません.  
Game=Change the current game type with this option.  
HiddenSongs=オンにすると一部楽曲が鬼モード・ルーレットでしかでてきません.  全曲表示させたい場合はオフにしておいてください.  
Instructions=一部モードで表示される説明画面を省略したい場合、SKIPにしてください.  
JudgeDifficulty=判定の設定をします.  数値が高ければ高いほど判定が厳しくなります.  
KeepTexturesInMemory=オンにするとテクスチャをメモリに残し、ディスクアクセスを減らします.  ただし、128MB以下のメモリの機種でONにしてはいけません。
SmoothLines=オンにするとグルーヴレーダーにアンチエイリアスがかかります.  
Language=言語を選択できます.  
LifeDifficulty=ライフバーの設定をします.  数値が高いほど減りやすくなります.  
Lyrics=一部楽曲で使われている歌詞を表示するかどうかの設定です.  
MarvelousTiming=パーフェクトより高い評価、マーベラス判定の設定です.  NEVERだと追加されず、Course Onlyはコースモードのみ、ALWAYSは常にマーベラス判定を追加します.  
MasterVolume=メインボリュームの音量を設定します.
MenuButtons=メニューボタンを使用するかどうかの設定です.  オフだとダンスパッドのみで全操作が行えるキー配置になります.  オンだとプレイ時以外は全てメニューボタンを使用することになります.  
MenuTimer=メニュータイマーを有効にするかどうかです.  オフだとタイマーのカウントダウンを行いません.  
MovieColor=ムービーの色数を設定します.   32bitだとある程度のメモリが必要になります.
OniScoreDisplay=鬼モードでのスコア表示方法です.  DDRMAX2方式(パーセンテージ方式)とDDREXTREME方式(ダンススコア方式)の二つの方式が設定可能です.  
OptionsNavigation=オプションでの移動方法を設定します.  SMスタイルだと矢印の左右で変更、上下でオプション項目を変更することができ、  アーケードスタイルでは左右とスタートボタンしか使いません.  
PickExtraStage=エキストラステージの設定です.  オフにすると特定の曲以外の選曲が不可能となります.  オンにすると特定の曲以外でも選曲はできます.  
ProgressiveLifebar=連続ミス(BOO/MISS)でのゲージの減り具合を設定します.   オフで未設定、8は一度連続でミスるとゲームオーバーになります.  
ProgressiveNonstopLifebar=コースプレイ時でのゲージ減少率の増加を設定します.  LifeDifficulty + この設定 = コース最後のゲージ減少率となります.  
ProgressiveStageLifebar=アーケードプレイ時でのゲージ減少率の増加を設定します.  LifeDifficulty + この設定 = 最終ステージでのゲージ減少率.  ただし、イベントモードでは適用されません.  
RandomAtEnd=オンにするとコースモードでのランダムコースが一番下にまとめられます.  
RandomBackgrounds=ランダム背景のパターン数を設定します.  
RefreshRate=リフレッシュレートを設定します.  ディスプレイによっては変更できない可能性もあります.  
ResamplingQuality=音質の設定をします.  
ScoringType=スコア計算方式を設定します.   MAX2以降のスコア計算方式か、5thのスコア計算方式のどちらかが選択できます。
ShowNameEntry=ネームエントリーを画面に表示する設定です.  RANKING SONGSの場合ランキング対象の連、鬼のみネームエントリーが表示されるようになります.  
ShowSongOptions=ソングオプションを出すかどうかの設定をします.  HIDEで非表示、SHOWで常に表示.  ASKはプレイヤーオプションで決定後、さらにスタートボタンを押しっぱなしにすると出てきます.  
ShowStats=現在の処理速度を表示します.   FPS = frames per second.   TPF = triangles per frame.    DPF = draws per frame.  
ShowBanners=曲のバナーを表示するかしないかの設定です。
SoloSingles=この設定をオンにするとSOLOモードで無くても矢印を中央に表示します（シングルプレイ時のみ）
SongGroup=難易度設定後に出てくるソンググループを表示するかの設定です.  
SongsPerPlay=アーケードモードでプレイできる最大曲数を設定します.
EventMode=ONにすると曲数制限が無くなり、何曲でもプレイできる状態になりますが、スコアが保存されなくなります。  イベントモードでタイトルに戻るにはバックボタンを押してください。 
SoundVolume=
TextureColor=テクスチャカラーの色を設定します.  32bitだと大量のメモリを必要とします.
TextureResolution=テクスチャーの最大解像度を設定します.  数値が低ければ低いほど軽くなりますが、1024以下だとみにくくなる場合があります.  
Theme=stepmaniaフォルダ内に入っているテーマ一覧を表示します.  詳細及び作り方などはREADMEをご覧下さい.  
Translations=オンにすると設定されている一部楽曲を日本語などの他言語に変換します.  
UnlockSystem=とある条件で隠し曲が出現するUnlockシステムを使用します.  
WaitForVsync=VSYNCを待つかどうかの設定です.  オフにするとFPSはあがりますが、カクカクに動く可能性があります.   ウィンドウモードでは無効です.
WheelSections=ホイールにカデコリを表示するかどうかの設定です.  ALWAYSだと常に表示(PLAYER'S BESTは除く)、NEVERは表示無し、 ABC ONLYはABCソートのみ表示されます.  
WheelSpeed=ホイールの移動速度を調整します.  

Speed=譜面が流れるスピードを調整します.  頭文字にCが付いているスピードはBPMによる速度変化を無視します.
Accel=譜面の流れるタイプを選択します。
Effect=譜面にエフェクトを付けます.  これらのオプションは複数選択する事ができます.  カーソルを合わせてスタートでON/OFF、下キーで次の項目に進めます。
Appearance=譜面を途中から消去もしくは完全消去する事ができます.  これらのオプションは複数選択する事ができます.  カーソルを合わせてスタートでON/OFF、下キーで次の項目に進めます。
Turn=譜面を回転もしくは入れ替える事ができます.  これらのオプションは複数選択する事ができます.  カーソルを合わせてスタートでON/OFF、下キーで次の項目に進めます。
Insert=譜面に矢印を追加するオプションです(LITTLEのみ減少).  これらのオプションは複数選択する事ができます.  カーソルを合わせてスタートでON/OFF、下キーで次の項目に進めます。
Scroll=譜面が流れる方向を選択するオプションです.  REVERSEで矢印の流れる方向が逆転。SPLIT、ALTERNATE、CROSSでそれぞれバラバラに。
NoteSkins=矢印の見た目を変更します。
Noteskin=矢印の見た目を変更します。
Judgment Font=
Hold Judgment=
Holds=フリーズアローに関するオプションです.  OFFでフリーズアロー無し、ONでフリーズアローあり。それ以外はフリーズアローが追加されます。
Mines=地雷オブジェに関するオプションです.  OFFで地雷オブジェ無し、ONで地雷オブジェあり。ADDは地雷オブジェを追加します。
Hide=矢印・バックグラウンド・判定を隠すオプションです.  これらのオプションは複数選択する事ができます.  カーソルを合わせてスタートでON/OFF、下キーで次の項目に進めます。
Persp=矢印の流れに奥行きが加わります。
Steps=プレイする譜面を選びます。
Characters=キャラクターデータが入っている場合のみ使用可
SaveToProfile=Requires profile or memory card.

